<!DOCTYPE html>
<html lang="fr">
<head>
<script src="joydeck-guard.js"></script>
<script id="joydeck-embed">
(function(){
  var q=new URLSearchParams(location.search),slot=q.get('slot'),embed=q.get('embed');
  if(slot){
    var P=Storage.prototype,g=P.getItem,s=P.setItem,r=P.removeItem;
    var k=function(x){return (typeof x==='string'&&x.indexOf('joydeck_')===0&&x.indexOf('@')<0)?x+'@'+slot:x;};
    P.getItem=function(x){return g.call(this,k(x));};
    P.setItem=function(x,v){return s.call(this,k(x),v);};
    P.removeItem=function(x){return r.call(this,k(x));};
  }
  if(embed){
    document.write('<style>html,body{margin:0!important;padding:0!important;background:#fff!important;overflow:hidden!important;display:block!important}.sidebar,.toolbar,.change-btn,.name-bg-eye,.resize-handle,.tip-eye,.overflow-badge{display:none!important}.preview-area{margin:0!important;padding:0!important;display:block!important}.page{zoom:1!important;margin:0!important;box-shadow:none!important;outline:none!important;width:816px!important;height:1056px!important}</style>');
  } else if(slot){
    var t=null;
    var go=function(){clearTimeout(t);t=setTimeout(function(){var b=document.getElementById('saveBtn');if(b)b.click();},700);};
    document.addEventListener('DOMContentLoaded',function(){
      ['input','change','click'].forEach(function(ev){document.addEventListener(ev,function(e){if(e.target&&e.target.id==='saveBtn')return;go();},true);});
    });
    window.addEventListener('pagehide',function(){var b=document.getElementById('saveBtn');if(b)b.click();});
  }
})();
</script>

<meta charset="UTF-8">
<title>Éditeur — Page Citation</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&family=Playfair+Display:wght@700;800&family=Space+Grotesk:wght@500;700&family=Montserrat:wght@600;700;800&family=Outfit:wght@600;700&family=Bricolage+Grotesque:wght@600;700&family=DM+Serif+Display&family=Cormorant+Garamond:wght@600;700&family=Fraunces:wght@600;700&family=Marcellus&family=Prata&family=Italiana&family=Abril+Fatface&family=Libre+Baskerville:wght@700&family=Cinzel:wght@600;700&family=Great+Vibes&family=Dancing+Script:wght@700&family=Parisienne&family=Alex+Brush&family=Allura&family=Sacramento&family=Tangerine:wght@700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>

  :root {
    --color-bg: #4C1D95;
    --color-quote-text: #FFFFFF;
    --color-highlight: #F5C244;
    --color-mark: #F5C244;
    --color-attribution: #DDD6FE;

    --font-heading: 'Poppins', sans-serif;
    --font-body: 'Inter', sans-serif;

    --font-size-quote: 40px;
    --font-size-attribution: 15px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #EDEBE6;
    font-family: var(--font-body);
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .page {
    width: 816px;
    height: 1056px;
    background: var(--color-bg);
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    zoom: 0.65;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 90px;
  }

  .quote-mark {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 120px;
    color: var(--color-mark);
    line-height: 1;
    margin-bottom: 10px;
    opacity: 0.9;
  }

  .quote-text {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: var(--font-size-quote);
    line-height: 1.25;
    color: var(--color-quote-text);
    margin: 0 0 40px 0;
  }
  .quote-text .highlight { color: var(--color-highlight); }

  .attribution {
    font-family: var(--font-body);
    font-size: var(--font-size-attribution);
    color: var(--color-attribution);
  }

  .wave-deco {
    position: absolute;
    bottom: 60px;
    right: 70px;
    width: 160px;
    height: 40px;
    opacity: 0.5;
  }

  [contenteditable="true"] { outline: none; }
  [contenteditable="true"]:hover { outline: 1px dashed rgba(255,255,255,0.25); outline-offset: 2px; }
  [contenteditable="true"]:focus { outline: 1px dashed rgba(255,255,255,0.5); outline-offset: 2px; }

  /* ============ TOOLBAR ============ */
  .toolbar {
    position: fixed; top: 0; left: 300px; right: 0; height: 52px;
    background: #FFFFFF; border-bottom: 1px solid #E4E2DD;
    display: flex; align-items: center; gap: 10px; padding: 0 20px; z-index: 100;
    overflow-x: auto;
  }
  .toolbar button {
    padding: 8px 14px; border: 1px solid #E4E2DD; border-radius: 6px;
    background: #FAFAF8; font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer;
    white-space: nowrap;
  }
  .toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .toolbar button.save-btn { background: #4C1D95; color: #fff; border-color: #4C1D95; }
  .toolbar button.export-btn { background: #1A1A1A; color: #fff; border-color: #1A1A1A; }
  .toolbar .save-status { font-size: 12px; color: #8A8781; white-space: nowrap; }

  /* ============ SIDEBAR ============ */
  .sidebar {
    width: 300px;
    background: #FFFFFF;
    border-right: 1px solid #E4E2DD;
    padding: 28px 24px;
    overflow-y: auto;
    position: fixed;
    top: 0; bottom: 0; left: 0;
  }
  .sidebar h2 { font-size: 15px; font-weight: 700; margin: 0 0 4px 0; color: #1A1A1A; }
  .sidebar .sub { font-size: 12px; color: #8A8781; margin: 0 0 24px 0; }
  .control-group { margin-bottom: 22px; }
  .control-group label { display: block; font-size: 12px; font-weight: 600; color: #4A4842; margin-bottom: 8px; }
  .swatch-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .swatch-row input[type="color"] { width: 36px; height: 36px; border: 1px solid #E4E2DD; border-radius: 6px; padding: 0; cursor: pointer; }
  .swatch-row span { font-size: 11px; color: #8A8781; }
  select.font-select { width: 100%; padding: 8px 10px; border: 1px solid #E4E2DD; border-radius: 6px; font-size: 13px; font-family: 'Inter', sans-serif; background: #FAFAF8; }
  hr { border: none; border-top: 1px solid #EEEDE9; margin: 20px 0; }

  .preview-area {
    margin-left: 300px;
    padding: 92px 40px 40px 40px;
    display: flex;
    justify-content: center;
  }

  @media print {
    body { background: #fff !important; margin: 0 !important; padding: 0 !important; display: block !important; }
    .sidebar, .toolbar { display: none !important; }
    .preview-area { padding: 0 !important; margin: 0 !important; display: block !important; }
    .page {
      zoom: 1 !important;
      width: 8.5in !important;
      height: 11in !important;
      box-shadow: none !important;
      margin: 0 !important;
    }
    @page { size: 8.5in 11in; margin: 0; }
  }

</style>
</head>
<body>

  <div class="sidebar">
    <h2>Personnaliser</h2>
    <p class="sub">Modifie les couleurs, fonts et tailles — la structure reste fixe.</p>

    <div class="control-group">
      <label>Couleurs</label>
      <div class="swatch-row"><input type="color" id="colorBg" value="#4C1D95"><span>Fond</span></div>
      <div class="swatch-row"><input type="color" id="colorQuoteText" value="#FFFFFF"><span>Texte de citation</span></div>
      <div class="swatch-row"><input type="color" id="colorHighlight" value="#F5C244"><span>Mise en évidence</span></div>
      <div class="swatch-row"><input type="color" id="colorAttribution" value="#DDD6FE"><span>Attribution</span></div>
    </div>

    <hr>

    <div class="control-group">
      <label>Police</label>
      <select class="font-select" id="fontHeading">
        <option value="'Poppins', sans-serif">Poppins</option>
        <option value="'Playfair Display', serif">Playfair Display</option>
        <option value="'Space Grotesk', sans-serif">Space Grotesk</option>
        <option value="'Montserrat', sans-serif">Montserrat</option>
        <option value="'Outfit', sans-serif">Outfit</option>
        <option value="'Bricolage Grotesque', sans-serif">Bricolage Grotesque</option>
        <option value="'DM Serif Display', serif">DM Serif Display</option>
        <option value="'Cormorant Garamond', serif">Cormorant Garamond</option>
        <option value="'Fraunces', serif">Fraunces</option>
        <option value="'Marcellus', serif">Marcellus</option>
        <option value="'Prata', serif">Prata</option>
        <option value="'Italiana', serif">Italiana</option>
        <option value="'Abril Fatface', serif">Abril Fatface</option>
        <option value="'Libre Baskerville', serif">Libre Baskerville</option>
        <option value="'Cinzel', serif">Cinzel</option>
        <option value="'Great Vibes', cursive">Great Vibes (calligraphie)</option>
        <option value="'Dancing Script', cursive">Dancing Script (calligraphie)</option>
        <option value="'Parisienne', cursive">Parisienne (calligraphie)</option>
        <option value="'Alex Brush', cursive">Alex Brush (calligraphie)</option>
        <option value="'Allura', cursive">Allura (calligraphie)</option>
        <option value="'Sacramento', cursive">Sacramento (calligraphie)</option>
        <option value="'Tangerine', cursive">Tangerine (calligraphie)</option>
        <option value="'Pinyon Script', cursive">Pinyon Script (calligraphie)</option>
      </select>
    </div>

    <hr>

    <div class="control-group">
      <label>Taille de la citation</label>
      <input type="range" id="sizeQuote" min="22" max="64" value="40" style="width:100%;">
    </div>
    <div class="control-group">
      <label>Taille de l'attribution</label>
      <input type="range" id="sizeAttribution" min="11" max="24" value="15" style="width:100%;">
    </div>
  </div>

  <div class="toolbar">
    <button id="undoBtn" title="Annuler">&#8630; Annuler</button>
    <button id="redoBtn" title="Retablir">&#8631; Retablir</button>
    <button type="button" class="export-btn" id="exportPdfBtn">Exporter PDF</button>
    <button class="save-btn" id="saveBtn">Enregistrer</button>
    <span class="save-status" id="saveStatus"></span>
  </div>

  <div class="preview-area">
    <div class="page" id="quote-page">
      <div class="quote-mark">&#8220;</div>
      <h2 class="quote-text" contenteditable="true">Your voice has power. Your story has impact. Your content can <span class="highlight">change lives.</span></h2>
      <p class="attribution" contenteditable="true">— Use it intentionally.</p>
    </div>
  </div>

  <script>
    const root = document.documentElement.style;

    document.getElementById('colorBg').addEventListener('input', e => root.setProperty('--color-bg', e.target.value));
    document.getElementById('colorQuoteText').addEventListener('input', e => root.setProperty('--color-quote-text', e.target.value));
    document.getElementById('colorHighlight').addEventListener('input', e => {
      root.setProperty('--color-highlight', e.target.value);
      root.setProperty('--color-mark', e.target.value);
    });
    document.getElementById('colorAttribution').addEventListener('input', e => root.setProperty('--color-attribution', e.target.value));

    document.getElementById('fontHeading').addEventListener('change', e => root.setProperty('--font-heading', e.target.value));
    document.querySelectorAll('.font-select option').forEach(opt => { opt.style.fontFamily = opt.value; });

    document.getElementById('sizeQuote').addEventListener('input', e => root.setProperty('--font-size-quote', e.target.value + 'px'));
    document.getElementById('sizeAttribution').addEventListener('input', e => root.setProperty('--font-size-attribution', e.target.value + 'px'));

    // ============ undo/redo/save system ============
    const STORAGE_KEY = 'joydeck_' + location.pathname.split('/').pop();
    let history = [];
    let historyIndex = -1;
    let suppressCapture = false;

    const colorBg = document.getElementById('colorBg');
    const colorQuoteText = document.getElementById('colorQuoteText');
    const colorHighlight = document.getElementById('colorHighlight');
    const colorAttribution = document.getElementById('colorAttribution');
    const fontHeading = document.getElementById('fontHeading');
    const sizeQuote = document.getElementById('sizeQuote');
    const sizeAttribution = document.getElementById('sizeAttribution');
    const editableEls = Array.from(document.querySelectorAll('[contenteditable="true"]'));

    function captureState() {
      return {
        colorBg: colorBg.value,
        colorQuoteText: colorQuoteText.value,
        colorHighlight: colorHighlight.value,
        colorAttribution: colorAttribution.value,
        fontHeading: fontHeading.value,
        sizeQuote: sizeQuote.value,
        sizeAttribution: sizeAttribution.value,
        editableContent: editableEls.map(el => el.innerHTML)
      };
    }

    function applyState(state) {
      if (!state) return;
      suppressCapture = true;
      root.setProperty('--color-bg', state.colorBg);
      root.setProperty('--color-quote-text', state.colorQuoteText);
      root.setProperty('--color-highlight', state.colorHighlight);
      root.setProperty('--color-mark', state.colorHighlight);
      root.setProperty('--color-attribution', state.colorAttribution);
      root.setProperty('--font-heading', state.fontHeading);
      root.setProperty('--font-size-quote', state.sizeQuote + 'px');
      root.setProperty('--font-size-attribution', state.sizeAttribution + 'px');
      colorBg.value = state.colorBg;
      colorQuoteText.value = state.colorQuoteText;
      colorHighlight.value = state.colorHighlight;
      colorAttribution.value = state.colorAttribution;
      fontHeading.value = state.fontHeading;
      sizeQuote.value = state.sizeQuote;
      sizeAttribution.value = state.sizeAttribution;
      if (state.editableContent) {
        state.editableContent.forEach((html, i) => { if (editableEls[i]) editableEls[i].innerHTML = html; });
      }
      suppressCapture = false;
    }

    function pushHistory() {
      if (suppressCapture) return;
      const state = captureState();
      history = history.slice(0, historyIndex + 1);
      history.push(state);
      historyIndex = history.length - 1;
      updateButtons();
    }

    function updateButtons() {
      document.getElementById('undoBtn').disabled = historyIndex <= 0;
      document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
    }

    [colorBg, colorQuoteText, colorHighlight, colorAttribution, fontHeading, sizeQuote, sizeAttribution].forEach(el => {
      el.addEventListener('change', () => pushHistory());
    });
    editableEls.forEach(el => { el.addEventListener('blur', () => pushHistory()); });

    document.getElementById('undoBtn').addEventListener('click', () => {
      if (historyIndex > 0) { historyIndex--; applyState(history[historyIndex]); updateButtons(); }
    });
    document.getElementById('redoBtn').addEventListener('click', () => {
      if (historyIndex < history.length - 1) { historyIndex++; applyState(history[historyIndex]); updateButtons(); }
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(captureState()));
      const status = document.getElementById('saveStatus');
      status.textContent = 'Enregistre \u2713';
      setTimeout(() => { status.textContent = ''; }, 2000);
    });

    document.getElementById('exportPdfBtn').addEventListener('click', () => { window.print(); });

    setTimeout(function() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) { try { applyState(JSON.parse(saved)); } catch(e) {} }
      pushHistory();
      updateButtons();
    }, 0);
  </script>

</body>
</html>
